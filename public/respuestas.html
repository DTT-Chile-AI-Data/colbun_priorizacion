<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respuestas registradas | Colbún</title>
  <style>
    :root {
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface-alt: #eef3f8;
      --ink: #17212f;
      --muted: #5b6b7a;
      --line: #dfe6ee;
      --navy: #0e2233;
      --navy-soft: #eaf1f8;
      --green: #1f7a3e;
      --green-soft: #e9f7ee;
      --yellow: #9d6a00;
      --yellow-soft: #fff4dc;
      --red: #b42318;
      --red-soft: #fdecec;
      --shadow: 0 10px 28px rgba(15, 31, 45, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    .topbar {
      background: var(--navy);
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow);
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .topbar a {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 600;
      background: rgba(255,255,255,0.04);
    }

    .container {
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 20px 40px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .header-row h2 {
      margin: 0;
      font-size: clamp(1.8rem, 2vw, 2.5rem);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--navy-soft);
      color: var(--navy);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: 0.8rem;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }

    .stat .label {
      display: block;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .stat .value {
      font-size: clamp(1.6rem, 2vw, 2.25rem);
      font-weight: 800;
      line-height: 1.1;
    }

    .groups {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .group {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      background: linear-gradient(180deg, #f9fbfd 0%, #f1f5f9 100%);
      border-bottom: 1px solid var(--line);
    }

    .group-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin: 0;
    }

    .count-badge {
      background: var(--navy-soft);
      border: 1px solid var(--line);
      color: var(--navy);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .records {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      padding: 18px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfd 100%);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .agent {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      white-space: nowrap;
      border: 1px solid transparent;
    }

    .chip.priorizar {
      background: var(--green-soft);
      color: var(--green);
      border-color: rgba(31, 122, 62, 0.18);
    }

    .chip.neutral {
      background: #edf1f5;
      color: #3c4d5d;
      border-color: rgba(92, 108, 123, 0.2);
    }

    .chip.descartar {
      background: var(--red-soft);
      color: var(--red);
      border-color: rgba(180, 35, 24, 0.2);
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .meta strong {
      color: var(--ink);
    }

    .label {
      display: block;
      margin: 0 0 6px;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .text {
      margin: 0;
      color: var(--ink);
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: 72px;
      white-space: pre-wrap;
    }

    .empty {
      background: var(--surface);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 30px 24px;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    @media (max-width: 700px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .header-row { align-items: flex-start; }
      .records { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Colbún · Respuestas de priorización</h1>
    <a href="/">← Volver al formulario</a>
  </header>

  <main class="container">
    <div class="header-row">
      <div>
        <div class="tag">Vista visual</div>
        <h2>Respuestas registradas</h2>
      </div>
    </div>

    <section id="summary" class="summary" aria-live="polite"></section>
    <section id="groups" class="groups" aria-live="polite"></section>
  </main>

  <script>
    const processLabels = {
      ingresos: 'Ingresos',
      compras: 'Compras',
      despachos: 'Despachos',
      acreditacion: 'Acreditación'
    };

    const decisionOrder = { priorizar: 1, neutral: 2, descartar: 3 };

    function normalizeDecision(value) {
      const v = String(value || '').trim().toLowerCase();
      if (v.includes('prior')) return 'priorizar';
      if (v.includes('desc')) return 'descartar';
      return 'neutral';
    }

    function safeJson(value) {
      if (!value) return {};
      if (typeof value === 'object') return value;
      try { return JSON.parse(value); } catch { return {}; }
    }

    function renderSummary(rows) {
      const total = rows.length;
      const procesos = Object.keys(processLabels).length;
      const priorizar = rows.filter((row) => normalizeDecision(row.decision) === 'priorizar').length;
      const neutral = rows.filter((row) => normalizeDecision(row.decision) === 'neutral').length;
      const descartar = rows.filter((row) => normalizeDecision(row.decision) === 'descartar').length;

      document.getElementById('summary').innerHTML = `
        <div class="stat">
          <span class="label">Total respuestas</span>
          <span class="value">${total}</span>
        </div>
        <div class="stat">
          <span class="label">Procesos activos</span>
          <span class="value">${procesos}</span>
        </div>
        <div class="stat">
          <span class="label">Priorizar</span>
          <span class="value">${priorizar}</span>
        </div>
        <div class="stat">
          <span class="label">Neutral</span>
          <span class="value">${neutral}</span>
        </div>
        <div class="stat">
          <span class="label">Descartar</span>
          <span class="value">${descartar}</span>
        </div>
      `;
    }

    function renderGroups(rows) {
      const groupsRoot = document.getElementById('groups');

      if (!rows.length) {
        groupsRoot.innerHTML = '<div class="empty">Aún no hay respuestas registradas para mostrar.</div>';
        return;
      }

      const grouped = {};
      for (const row of rows) {
        const key = String(row.process_key || row.processKey || 'ingresos');
        if (!grouped[key]) grouped[key] = [];
        grouped[key].push(row);
      }

      const html = Object.entries(processLabels)
        .map(([key, label]) => {
          const items = (grouped[key] || []).sort((a, b) => Number(a.posicion || 0) - Number(b.posicion || 0));
          return `
            <section class="group">
              <div class="group-header">
                <h3 class="group-title">${label}</h3>
                <span class="count-badge">${items.length} respuestas</span>
              </div>
              <div class="records">
                ${items.length
                  ? items.map((row) => {
                      const decision = normalizeDecision(row.decision);
                      const raw = safeJson(row.raw_data || row);
                      const agentName = row.agent_name || raw.agent_name || 'Agente sin nombre';
                      const decisionText = decision === 'priorizar' ? 'Priorizar' : decision === 'descartar' ? 'Descartar' : 'Neutral';
                      const justificacion = String(row.justificacion || raw.justificacion || 'Sin justificación registrada.').trim();
                      const position = Number(row.posicion || raw.posicion || 1);

                      const responderEmail = row.respondent_email || raw.respondent_email || 'Sin email';

                    return `
                        <article class="card">
                          <div class="card-header">
                            <h4 class="agent">${agentName}</h4>
                            <span class="chip ${decision}">${decisionText}</span>
                          </div>
                          <div class="meta">
                            <span><strong>ID:</strong> ${row.agent_id ?? raw.agent_id ?? '-'}</span>
                            <span><strong>Posición:</strong> ${position}</span>
                            <span><strong>Respondió:</strong> ${responderEmail}</span>
                          </div>
                          <div>
                            <span class="label">Justificación</span>
                            <p class="text">${justificacion || 'Sin justificación registrada.'}</p>
                          </div>
                        </article>
                      `;
                    }).join('')
                  : '<div class="empty" style="width:100%;">Sin registros para este proceso.</div>'}
              </div>
            </section>
          `;
        })
        .join('');

      groupsRoot.innerHTML = html;
    }

    async function loadResponses() {
      try {
        const response = await fetch('/api/respuestas');
        if (!response.ok) throw new Error('No se pudieron cargar las respuestas');
        const data = await response.json();
        const rows = Array.isArray(data.rows) ? data.rows : [];
        renderSummary(rows);
        renderGroups(rows);
      } catch (error) {
        document.getElementById('groups').innerHTML = `
          <div class="empty">
            No se pudo cargar la información. <br />${error.message}
          </div>
        `;
      }
    }

    loadResponses();
  </script>
</body>
</html>
